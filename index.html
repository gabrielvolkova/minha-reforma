<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#23483d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Minha Reforma"><meta name="description" content="Organize tarefas, tempo, pausas e gastos da sua reforma."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Minha Reforma</title>
<style>
:root{--green:#23483d;--green2:#316b58;--bg:#f4f5f1;--card:#fff;--ink:#202a25;--muted:#738078;--line:#e4e9e4;--amber:#b7791f;--red:#b84b48;--shadow:0 5px 22px #1d39200d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px 22px}.top{background:var(--green);color:#fff;margin:0 -16px 18px;padding:24px 20px 22px;border-radius:0 0 24px 24px}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:.13em;text-transform:uppercase;opacity:.8}.top h1{font-size:28px;margin:8px 0 4px}.top p{margin:0;color:#d4e1da;font-size:13px}.avatar{width:42px;height:42px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}.stat{background:#ffffff16;border:1px solid #ffffff1c;border-radius:14px;padding:11px}.stat strong{display:block;font-size:21px}.stat span{font-size:11px;color:#d4e1da}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}h2{font-size:17px;margin:0 0 13px}.muted{color:var(--muted);font-size:12px}.progress{height:9px;background:#e9eee9;border-radius:9px;overflow:hidden;margin:10px 0 6px}.progress i{display:block;height:100%;background:#4c9878;border-radius:9px;width:0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.btn{padding:12px 14px;border-radius:12px;background:var(--green);color:white;font-weight:650}.btn.light{background:#edf3ef;color:var(--green)}.btn.outline{background:white;border:1px solid var(--line);color:var(--ink)}.btn.warn{background:#fff2df;color:#87530d}.btn.danger{background:#fff0ef;color:var(--red)}.btn.small{padding:8px 10px;font-size:12px}.btn.full{width:100%}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:4}.tabs button{background:none;color:var(--muted);font-size:10px;flex:1;max-width:130px;padding:5px}.tabs button b{display:block;font-size:20px;margin-bottom:3px;font-weight:500}.tabs button.active{color:var(--green);font-weight:700}.task{border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}.tag{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;background:#edf2ee;color:#53675b}.tag.high{background:#fff0ef;color:#a43d39}.tag.medium{background:#fff4df;color:#946315}.tag.done{background:#e7f4eb;color:#28734b}.task h3{font-size:14px;margin:0 0 6px}.task p{margin:0 0 8px}.task-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;color:var(--ink)}.field textarea{min-height:82px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.timer{font-size:31px;font-weight:750;letter-spacing:.02em;font-variant-numeric:tabular-nums}.empty{text-align:center;padding:24px 12px;color:var(--muted)}.barrow{display:flex;align-items:center;gap:9px;margin:10px 0}.barlabel{width:105px;font-size:12px;color:var(--muted)}.bartrack{height:10px;background:#edf0ed;border-radius:9px;overflow:hidden;flex:1}.bartrack i{height:100%;display:block;background:#4c9878}.barval{font-size:11px;width:48px;text-align:right}.notice{background:#edf4ef;border-radius:12px;padding:12px;color:#365b48;font-size:12px;line-height:1.5}.pillrow{display:flex;gap:7px;flex-wrap:wrap}.pillrow button{border:1px solid var(--line);border-radius:20px;background:white;padding:8px 11px;font-size:12px}.pillrow button.sel{background:#e8f1eb;border-color:#8eae9b;color:var(--green)}.section{margin-top:19px}.toast{position:fixed;left:16px;right:16px;bottom:90px;background:#23372d;color:white;padding:12px 15px;border-radius:12px;z-index:8;box-shadow:var(--shadow);font-size:13px}.modalback{position:fixed;inset:0;background:#101a15a6;z-index:10;display:grid;place-items:end center;padding:12px}.modal{background:var(--bg);width:min(100%,600px);border-radius:22px;padding:20px;max-height:88vh;overflow:auto}.close{background:#e7ece7;border-radius:50%;width:32px;height:32px}.smallnote{font-size:11px;color:var(--muted);line-height:1.5}
</style></head>
<body><div class="app">
<header class="top"><div class="topline"><div><div class="brand">Seu projeto, no seu ritmo</div><h1>Minha Reforma</h1><p id="today"></p></div><div class="avatar">⌂</div></div><div class="stats"><div class="stat"><strong id="statPending">0</strong><span>Pendentes</span></div><div class="stat"><strong id="statDone">0</strong><span>Concluídas</span></div><div class="stat"><strong id="statHours">0h</strong><span>Trabalhadas</span></div></div></header>
<main id="main"></main></div>
<nav class="tabs"><button data-tab="home" class="active"><b>⌂</b>Início</button><button data-tab="tasks"><b>☷</b>Tarefas</button><button data-tab="report"><b>▥</b>Relatórios</button><button data-tab="more"><b>⚙</b>Mais</button></nav>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='minha-reforma-v1';const AREAS=['Geral','Quarto','Sala','Cozinha','Banheiro','Sacada','Área de serviço'];const REASONS=['Cansaço','Falta de tempo','Atividade doméstica','Falta de material','Imprevisto','Procrastinação'];let state=load();let tab='home',filter='Pendentes',tick=null;
function fresh(){return {tasks:[{id:id(),title:'Definir solução para instalação do ar-condicionado',area:'Sacada',priority:'Alta',createdAt:Date.now(),startedAt:null,completedAt:null,workMs:0,pausedMs:0,status:'pending',sessions:[],notes:''},{id:id(),title:'Finalizar revestimento/acabamento da parede',area:'Sacada',priority:'Média',createdAt:Date.now(),startedAt:null,completedAt:null,workMs:0,pausedMs:0,status:'pending',sessions:[],notes:''},{id:id(),title:'Finalizar parede da cabeceira',area:'Quarto',priority:'Média',createdAt:Date.now(),startedAt:null,completedAt:null,workMs:0,pausedMs:0,status:'pending',sessions:[],notes:''},{id:id(),title:'Revisar acabamentos e pendências',area:'Geral',priority:'Baixa',createdAt:Date.now(),startedAt:null,completedAt:null,workMs:0,pausedMs:0,status:'pending',sessions:[],notes:''}],activities:[],expenses:[],homeArrivals:[],active:null,budget:0,homeAddressNote:'',lastArrivalPrompt:null}}
function id(){return Math.random().toString(36).slice(2,10)}function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch{return fresh()}}function save(){localStorage.setItem(KEY,JSON.stringify(state));renderHeader()}function fmt(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}function hours(ms){return (ms/3600000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'h'}function date(ts){return ts?new Date(ts).toLocaleDateString('pt-BR'):'—'}function dateTime(ts){return ts?new Date(ts).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—'}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function elapsed(t){return t.workMs+(state.active?.taskId===t.id?Date.now()-state.active.startedAt:0)}function totalWork(){return state.tasks.reduce((a,t)=>a+elapsed(t),0)+state.activities.reduce((a,x)=>a+(x.durationMs||0),0)+(state.active?.kind==='activity'?Date.now()-state.active.startedAt:0)}function toast(s){let r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${escapeHtml(s)}</div>`;setTimeout(()=>r.innerHTML='',2600)}function renderHeader(){let pending=state.tasks.filter(t=>t.status!=='done').length,done=state.tasks.filter(t=>t.status==='done').length;document.getElementById('statPending').textContent=pending;document.getElementById('statDone').textContent=done;document.getElementById('statHours').textContent=hours(totalWork());document.getElementById('today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
function render(){renderHeader();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let m=document.getElementById('main');m.innerHTML=tab==='home'?home():tab==='tasks'?tasksPage():tab==='report'?report():more();}
function home(){let active=state.active;let activeTask=active?.kind==='task'?state.tasks.find(t=>t.id===active.taskId):null;let pct=state.tasks.length?Math.round(state.tasks.filter(t=>t.status==='done').length/state.tasks.length*100):0;let urgent=state.tasks.filter(t=>t.status!=='done').slice(0,3);return `<section class="card"><div class="row between"><h2>Progresso da reforma</h2><b>${pct}%</b></div><div class="progress"><i style="width:${pct}%"></i></div><div class="muted">${state.tasks.filter(t=>t.status==='done').length} de ${state.tasks.length} tarefas concluídas</div></section>${active?`<section class="card"><div class="row between"><h2>Atividade em andamento</h2><span class="tag">${active.kind==='task'?'Reforma':'Outra atividade'}</span></div><b>${escapeHtml(active.label)}</b><div class="timer" id="liveTimer">${fmt(Date.now()-active.startedAt)}</div><div class="task-actions"><button class="btn warn" onclick="pauseActive()">Ⅱ Pausar</button><button class="btn" onclick="finishActive()">✓ Finalizar</button></div></section>`:`<section class="card"><h2>O que você vai fazer agora?</h2><p class="muted">Comece uma tarefa da reforma ou registre outra atividade. Cozinhar, descansar e cuidar da casa não são procrastinação.</p><div class="grid2"><button class="btn" onclick="openTaskPicker()">＋ Reforma</button><button class="btn light" onclick="openActivity()">＋ Outra atividade</button></div></section>`}<section class="card"><div class="row between"><h2>Próximas tarefas</h2><button class="btn small light" onclick="tab='tasks';render()">Ver todas</button></div>${urgent.length?urgent.map(taskCard).join(''):'<div class="empty">Tudo em dia por aqui! ✨</div>'}</section><section class="notice">Dica: registre o que realmente ocupou seu tempo. O relatório só chama de procrastinação o período que você classificar assim.</section>`}
function taskCard(t){return `<article class="task"><div class="row between"><span class="tag">${escapeHtml(t.area)}</span><span class="tag ${t.priority==='Alta'?'high':t.priority==='Média'?'medium':''}">${escapeHtml(t.priority)}</span></div><h3 style="margin-top:8px">${escapeHtml(t.title)}</h3><p class="muted">${t.startedAt?'Começou em '+date(t.startedAt):'Ainda não iniciada'} · Trabalhado: ${fmt(elapsed(t))}</p><div class="task-actions">${t.status==='done'?'<span class="tag done">Concluída</span>':`<button class="btn small" onclick="startTask('${t.id}')">▶ ${t.startedAt?'Retomar':'Iniciar'}</button>`}<button class="btn small outline" onclick="editTask('${t.id}')">Editar</button>${t.status!=='done'?`<button class="btn small light" onclick="completeTask('${t.id}')">Concluir</button>`:''}</div></article>`}
function tasksPage(){let list=state.tasks.filter(t=>filter==='Todas'||(filter==='Pendentes'&&t.status!=='done')||(filter==='Concluídas'&&t.status==='done'));return `<div class="row between"><h2>Tarefas da reforma</h2><button class="btn small" onclick="editTask()">＋ Nova</button></div><div class="pillrow">${['Pendentes','Todas','Concluídas'].map(x=>`<button class="${filter===x?'sel':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div>${list.length?list.map(taskCard).join(''):'<div class="card empty">Nenhuma tarefa nesta lista.</div>'}`}
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function editTask(taskId){let t=state.tasks.find(x=>x.id===taskId)||{title:'',area:'Geral',priority:'Média',notes:''};openModal(`<div class="row between"><h2>${taskId?'Editar tarefa':'Nova tarefa'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveTask(event,'${taskId||''}')"><div class="field"><label>O que precisa fazer?</label><input name="title" required maxlength="100" value="${escapeHtml(t.title)}" placeholder="Ex.: Lixar a parede do quarto"></div><div class="grid2"><div class="field"><label>Cômodo</label><select name="area">${AREAS.map(a=>`<option ${a===t.area?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>Prioridade</label><select name="priority">${['Alta','Média','Baixa'].map(a=>`<option ${a===t.priority?'selected':''}>${a}</option>`).join('')}</select></div></div><div class="field"><label>Observações</label><textarea name="notes">${escapeHtml(t.notes||'')}</textarea></div><button class="btn full">Salvar tarefa</button>${taskId?`<button type="button" class="btn danger full" style="margin-top:8px" onclick="deleteTask('${taskId}')">Excluir tarefa</button>`:''}</form>`)}function saveTask(e,taskId){e.preventDefault();let f=new FormData(e.target),data={title:f.get('title').trim(),area:f.get('area'),priority:f.get('priority'),notes:f.get('notes')};if(taskId)Object.assign(state.tasks.find(t=>t.id===taskId),data);else state.tasks.unshift({id:id(),...data,createdAt:Date.now(),startedAt:null,completedAt:null,workMs:0,pausedMs:0,status:'pending',sessions:[]});save();closeModal();render();toast('Tarefa salva!')}function deleteTask(id){if(!confirm('Excluir esta tarefa?'))return;state.tasks=state.tasks.filter(t=>t.id!==id);save();closeModal();render()}
function openTaskPicker(){let list=state.tasks.filter(t=>t.status!=='done');openModal(`<div class="row between"><h2>Escolha uma tarefa</h2><button class="close" onclick="closeModal()">×</button></div>${list.length?list.map(t=>`<button class="task" style="display:block;width:100%;text-align:left;background:white" onclick="startTask('${t.id}')"><b>${escapeHtml(t.title)}</b><p class="muted">${escapeHtml(t.area)} · ${t.priority}</p></button>`).join(''):'<p class="muted">Cadastre uma tarefa primeiro.</p>'}<button class="btn light full" onclick="closeModal();editTask()">＋ Criar tarefa</button>`)}
function closePendingPause(){if(!state.lastPauseReason)return;let p=state.lastPauseReason;state.activities.push({id:id(),label:p.reason,category:p.reason==='Procrastinação'?'Procrastinação':'Pausa',reason:p.reason,note:p.note,durationMs:Math.max(0,Date.now()-p.at),start:p.at,end:Date.now()});state.lastPauseReason=null}
function startTask(id){if(state.active){toast('Finalize ou pause a atividade atual antes.');closeModal();return}closePendingPause();let t=state.tasks.find(x=>x.id===id);if(!t)return;if(!t.startedAt)t.startedAt=Date.now();t.status='doing';state.active={kind:'task',taskId:id,label:t.title,startedAt:Date.now()};state.active.startedLabel=dateTime(Date.now());save();closeModal();tab='home';render();startTicker();toast('Cronômetro iniciado. Bom trabalho!')}
function openActivity(){openModal(`<div class="row between"><h2>Registrar outra atividade</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="startActivity(event)"><div class="field"><label>O que você vai fazer?</label><input name="label" required placeholder="Ex.: Cozinhar, mercado, descanso..."></div><div class="field"><label>Categoria</label><select name="category"><option>Atividade doméstica</option><option>Trabalho</option><option>Descanso</option><option>Compromisso pessoal</option><option>Procrastinação</option><option>Outro</option></select></div><button class="btn full">Iniciar registro</button></form>`)}function startActivity(e){e.preventDefault();if(state.active){toast('Pause a atividade atual primeiro.');return}closePendingPause();let f=new FormData(e.target);state.active={kind:'activity',label:f.get('label'),category:f.get('category'),startedAt:Date.now()};save();closeModal();render();startTicker();toast('Atividade registrada.')}
function pauseActive(){if(!state.active)return;let a=state.active,now=Date.now(),duration=now-a.startedAt;if(a.kind==='task'){let t=state.tasks.find(x=>x.id===a.taskId);if(t){t.workMs+=duration;t.sessions.push({type:'work',start:a.startedAt,end:now,durationMs:duration})}}else state.activities.push({id:id(),label:a.label,category:a.category,durationMs:duration,start:a.startedAt,end:now});state.active=null;stopTicker();openPauseReason();save();render()}
function openPauseReason(){openModal(`<h2>Por que você vai parar?</h2><p class="muted">Uma pausa não é necessariamente procrastinação. Escolha o motivo real.</p><div class="pillrow">${REASONS.map(r=>`<button onclick="savePause('${r}')">${r}</button>`).join('')}</div><div class="field"><label>Observação (opcional)</label><input id="pauseNote" placeholder="Ex.: preciso preparar o jantar"></div><button class="btn light full" onclick="savePause('Pausa não classificada')">Registrar sem classificar</button>`)}function savePause(reason){let note=document.getElementById('pauseNote')?.value||'';state.lastPauseReason={reason,note,at:Date.now()};save();closeModal();render();toast('Pausa registrada. Ao retomar, o tempo parado será calculado.')}
function finishActive(){if(!state.active)return;let a=state.active,now=Date.now(),duration=now-a.startedAt;if(a.kind==='task'){let t=state.tasks.find(x=>x.id===a.taskId);if(t){t.workMs+=duration;t.sessions.push({type:'work',start:a.startedAt,end:now,durationMs:duration})}}else state.activities.push({id:id(),label:a.label,category:a.category,durationMs:duration,start:a.startedAt,end:now});state.active=null;stopTicker();save();render();toast('Período registrado!')}
function completeTask(id){if(state.active?.taskId===id)finishActive();let t=state.tasks.find(x=>x.id===id);if(t){t.status='done';t.completedAt=Date.now();save();render();toast('Tarefa concluída. Parabéns!')}}function startTicker(){stopTicker();tick=setInterval(()=>{let el=document.getElementById('liveTimer');if(el&&state.active)el.textContent=fmt(Date.now()-state.active.startedAt);renderHeader()},1000)}function stopTicker(){if(tick)clearInterval(tick);tick=null}
function weekStart(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getTime()}function report(){let start=weekStart(Date.now()),end=start+7*86400000;let work=state.tasks.reduce((s,t)=>s+t.sessions.filter(x=>x.end>=start&&x.end<end).reduce((a,x)=>a+x.durationMs,0),0);if(state.active?.kind==='task'&&state.active.startedAt>=start)work+=Date.now()-state.active.startedAt;let acts=state.activities.filter(a=>a.end>=start&&a.end<end);let domestic=acts.filter(a=>a.category==='Atividade doméstica').reduce((s,a)=>s+(a.durationMs||0),0);let rest=acts.filter(a=>a.category==='Descanso').reduce((s,a)=>s+(a.durationMs||0),0);let procrast=acts.filter(a=>a.category==='Procrastinação'||a.reason==='Procrastinação').reduce((s,a)=>s+(a.durationMs||0),0);let pauses=acts.filter(a=>a.category==='Pausa').reduce((s,a)=>s+(a.durationMs||0),0);if(state.lastPauseReason&&state.lastPauseReason.at>=start)pauses+=Date.now()-state.lastPauseReason.at;let classified=work+domestic+rest+procrast+pauses;let pp=classified?Math.round(procrast/classified*100):0;let byCat=[['Reforma',work],['Atividades domésticas',domestic],['Descanso',rest],['Procrastinação',procrast],['Pausas',pauses]];return `<section class="card"><h2>Resumo da semana</h2><p class="muted">${date(start)} a ${date(end-1)}</p><div class="grid2"><div><div class="timer">${hours(work)}</div><div class="muted">Tempo na reforma</div></div><div><div class="timer">${hours(pauses)}</div><div class="muted">Pausas registradas</div></div><div><div class="timer">${hours(procrast)}</div><div class="muted">Procrastinação</div></div><div><div class="timer">${pp}%</div><div class="muted">Percentual de procrastinação</div></div></div></section><section class="card"><h2>Como o tempo foi distribuído</h2>${byCat.map(([n,v])=>`<div class="barrow"><span class="barlabel">${n}</span><div class="bartrack"><i style="width:${classified?Math.min(100,v/classified*100):0}%"></i></div><span class="barval">${hours(v)}</span></div>`).join('')}<p class="smallnote">O percentual considera apenas o tempo que você registrou e classificou. Tempo não registrado não será presumido como procrastinação.</p></section><section class="card"><h2>Progresso das tarefas</h2><p><b>${state.tasks.filter(t=>t.status==='done').length}</b> concluídas de <b>${state.tasks.length}</b> cadastradas.</p><p class="muted">O relatório semanal usa os períodos efetivamente registrados nesta semana.</p></section>`}
function more(){let spent=state.expenses.reduce((s,e)=>s+Number(e.amount||0),0);return `<section class="card"><h2>Controle financeiro</h2><div class="grid2"><div><div class="muted">Orçamento previsto</div><b>${money(state.budget)}</b></div><div><div class="muted">Já gasto</div><b>${money(spent)}</b></div></div><p>Saldo: <b>${money(state.budget-spent)}</b></p><button class="btn light full" onclick="budgetModal()">Editar orçamento</button><button class="btn outline full" style="margin-top:8px" onclick="expenseModal()">＋ Registrar despesa</button>${state.expenses.map(e=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${escapeHtml(e.title)}<small class="muted" style="display:block">${date(e.at)}</small></span><b>${money(e.amount)}</b></div>`).join('')}</section><section class="card"><h2>Backup dos seus dados</h2><p class="muted">Os dados ficam neste navegador, neste iPhone. Exporte um arquivo regularmente para não perdê-los se limpar o Safari ou trocar de aparelho.</p><button class="btn full" onclick="backup()">↓ Exportar backup</button><label class="btn light full" style="display:block;text-align:center;margin-top:8px">↑ Importar backup<input type="file" accept="application/json" hidden onchange="restore(event)"></label></section><section class="card"><h2>Chegada em casa e Atalhos</h2><p class="muted">Configure uma automação pessoal no app Atalhos para exibir a pergunta quando chegar em casa. O endereço fica configurado no próprio iPhone.</p><div class="notice">Atalhos → Automação → Chegar → escolha sua casa → Executar imediatamente → Adicionar ação “Mostrar notificação” com o texto: “Chegou em casa! Abra Minha Reforma e registre o que vai fazer: reforma, cozinhar, descansar ou outro compromisso.”</div><div class="field"><label>Observação sobre o local de chegada (opcional)</label><input id="homeNote" value="${escapeHtml(state.homeAddressNote)}" placeholder="Ex.: Minha casa"></div><button class="btn light full" onclick="saveHomeNote()">Salvar observação</button></section><section class="card"><h2>Privacidade</h2><p class="smallnote">O aplicativo não envia suas tarefas ou despesas para um servidor. O armazenamento local depende dos dados do Safari. A notificação por Atalhos é uma automação do iOS e não significa que o PWA tenha acesso contínuo ao GPS.</p><button class="btn danger full" onclick="clearAll()">Apagar todos os dados</button></section>`}
function budgetModal(){openModal(`<h2>Orçamento da reforma</h2><div class="field"><label>Valor previsto (R$)</label><input id="budgetInput" type="number" min="0" step="0.01" value="${state.budget}"></div><button class="btn full" onclick="state.budget=Number(document.getElementById('budgetInput').value);save();closeModal();render()">Salvar</button>`)}function expenseModal(){openModal(`<h2>Registrar despesa</h2><form onsubmit="addExpense(event)"><div class="field"><label>O que comprou?</label><input name="title" required></div><div class="field"><label>Valor (R$)</label><input name="amount" type="number" min="0" step="0.01" required></div><button class="btn full">Adicionar despesa</button></form>`)}function addExpense(e){e.preventDefault();let f=new FormData(e.target);state.expenses.unshift({id:id(),title:f.get('title'),amount:Number(f.get('amount')),at:Date.now()});save();closeModal();render()}function saveHomeNote(){state.homeAddressNote=document.getElementById('homeNote').value;save();toast('Observação salva.')}function backup(){let blob=new Blob([JSON.stringify({...state,backupCreatedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='minha-reforma-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('Backup exportado.')}function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.tasks)||!Array.isArray(x.activities))throw Error();if(!confirm('Importar este backup e substituir os dados atuais?'))return;state=x;state.active=null;save();render();toast('Backup restaurado.')}catch{alert('Arquivo de backup inválido.')}};r.readAsText(file)}function clearAll(){if(confirm('Isso apagará tarefas, atividades e despesas deste aparelho. Exportou seu backup?')&&confirm('Confirmar exclusão definitiva?')){state=fresh();save();render();toast('Dados apagados.')}}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));render();if(state.active)startTicker();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
